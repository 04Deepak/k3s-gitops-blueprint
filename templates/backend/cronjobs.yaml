# All CronJobs use concurrencyPolicy: Forbid — only one instance at a time.
# Each job runs the CLI runner: node dist/jobs/runner.js <job-name>
# Customize job names and schedules to match your application.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backend-broadcast-recovery
  namespace: {{NAMESPACE}}
  labels:
    app: {{PROJECT_NAME}}-cron
    job: broadcast-recovery
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 200
  jobTemplate:
    spec:
      activeDeadlineSeconds: 240
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: {{PROJECT_NAME}}-cron
            job: broadcast-recovery
        spec:
          imagePullSecrets:
            - name: ghcr-secret
          restartPolicy: Never
          containers:
            - name: job
              image: {{BACKEND_IMAGE}}:{{IMAGE_TAG}}
              command: ["node", "dist/jobs/runner.js", "broadcast-recovery"]
              env:
                - name: NODE_ENV
                  value: "production"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: backend-secrets
                      key: DATABASE_URL
                - name: DIRECT_URL
                  valueFrom:
                    secretKeyRef:
                      name: backend-secrets
                      key: DIRECT_URL
              envFrom:
                - secretRef:
                    name: backend-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
