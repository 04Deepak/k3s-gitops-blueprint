apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: {{NAMESPACE}}
data:
  pgbouncer.ini: |
    [databases]
    {{DB_NAME}} = host={{POSTGRES_CLUSTERIP}} port=5432 dbname={{DB_NAME}} auth_user={{DB_USER}}

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 5432
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt
    pool_mode = transaction
    max_client_conn = {{PGBOUNCER_MAX_CLIENT_CONN}}
    default_pool_size = {{PGBOUNCER_POOL_SIZE}}
    min_pool_size = {{PGBOUNCER_MIN_POOL_SIZE}}
    reserve_pool_size = 5
    reserve_pool_timeout = 3
    server_lifetime = 3600
    server_idle_timeout = 600
    log_connections = 0
    log_disconnections = 0
    log_pooler_errors = 1
    stats_period = 60
    ignore_startup_parameters = extra_float_digits,options
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: {{NAMESPACE}}
  labels:
    app: pgbouncer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          ports:
            - containerPort: 5432
              name: pgbouncer
          env:
            # The DSN lives in the pgbouncer-auth Secret, produced by pgbouncer-secret.yaml from
            # Infisical. It is deliberately NOT a literal here: this manifest is committed to
            # git and synced by ArgoCD, so anything inline is a credential in git history.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-auth
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: pgbouncer-config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
            - name: pgbouncer-auth
              mountPath: /etc/pgbouncer/userlist.txt
              subPath: userlist.txt
      volumes:
        - name: pgbouncer-config
          configMap:
            name: pgbouncer-config
        - name: pgbouncer-auth
          secret:
            secretName: pgbouncer-auth
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: {{NAMESPACE}}
  labels:
    app: pgbouncer
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: pgbouncer
  selector:
    app: pgbouncer
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgbouncer-pdb
  namespace: {{NAMESPACE}}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pgbouncer
