# Grafana behind Traefik with automatic Let's Encrypt TLS.
# Prometheus and Alertmanager are intentionally NOT exposed — use kubectl port-forward.
# Service name = <helm releaseName>-grafana; the release is "monitoring" (see argocd/monitoring.yaml).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-https
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{GRAFANA_DOMAIN}}`)
      kind: Rule
      services:
        - name: monitoring-grafana
          port: 80
  tls:
    certResolver: letsencrypt
    domains:
      - main: "{{GRAFANA_DOMAIN}}"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-http-redirect
  namespace: monitoring
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`{{GRAFANA_DOMAIN}}`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: monitoring-grafana
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: monitoring
spec:
  redirectScheme:
    scheme: https
    permanent: true
