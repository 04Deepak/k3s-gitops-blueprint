# Grafana Alloy (grafana/alloy chart) — ships container logs to Loki.
# Promtail is deprecated; Alloy replaces it. Runs as a DaemonSet (one pod per node).
# EXPERIMENTAL: component names and chart keys were checked against the chart, not run live.
#
# IMPORTANT — log redaction: Loki stores whatever your apps print, including tokens and personal
# data, for the whole retention period. Fix what your apps log first. A commented redaction
# example is included below; test it on your own log lines before enabling it.
alloy:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi
  configMap:
    create: true
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        // Only collect logs from the app namespaces. Collecting everything is the fastest
        // way to run out of CPU, RAM and disk on a small server.
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "{{NAMESPACE}}|{{STAGING_NAMESPACE}}"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.default.receiver]
      }

      // Redaction example (UNTESTED, replace the source above's forward_to with
      // [loki.process.redact.receiver] to use it). The `replace` stage swaps the FIRST
      // capture group, so capture only the secret part.
      //
      // loki.process "redact" {
      //   stage.replace {
      //     expression = `(?i)authorization:\s*bearer\s+([A-Za-z0-9._~+/=-]+)`
      //     replace    = "[REDACTED]"
      //   }
      //   forward_to = [loki.write.default.receiver]
      // }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

controller:
  type: daemonset
