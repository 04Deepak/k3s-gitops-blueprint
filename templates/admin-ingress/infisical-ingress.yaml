apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: infisical-https
  namespace: infisical
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{INFISICAL_DOMAIN}}`)
      kind: Rule
      services:
        - name: infisical-backend
          port: 8080
  tls:
    certResolver: letsencrypt
    domains:
      - main: "{{INFISICAL_DOMAIN}}"
