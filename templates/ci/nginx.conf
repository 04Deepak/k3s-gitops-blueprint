# Nginx config for frontend SPA + backend API reverse proxy
# Copy to: <your-frontend-repo>/nginx.conf
#
# Template placeholders:
#   {{BACKEND_SERVICE}} — K8s backend service name (e.g. backend-service)
#   {{BACKEND_PORT}}    — backend container port (e.g. 5000)

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide nginx version
    server_tokens off;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # ── Gzip ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ── Security Headers ───────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # CSP in Report-Only mode — tighten once you know your sources
        add_header Content-Security-Policy-Report-Only
            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' {{DOMAIN}};"
            always;

        # ── API Reverse Proxy ──────────────────────────────────────────
        # Proxies /api/ requests to the backend K8s service.
        # In-cluster, backend-service resolves via K8s DNS.
        location /api/ {
            proxy_pass http://{{BACKEND_SERVICE}}:{{BACKEND_PORT}}/api/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE: disable buffering so events stream immediately
            proxy_buffering off;
            proxy_cache off;

            # Timeouts for long-lived connections (SSE, file uploads)
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── Static Assets (hashed filenames) ───────────────────────────
        # Vite produces hashed filenames — cache aggressively.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── SPA Fallback ───────────────────────────────────────────────
        # All non-file, non-API requests serve index.html (client-side routing).
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Block dotfiles
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
