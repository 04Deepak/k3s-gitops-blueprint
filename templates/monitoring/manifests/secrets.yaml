# Syncs monitoring credentials from Infisical into one K8s Secret: monitoring-secrets
# Infisical folder /monitoring must contain these keys:
#   SLACK_WEBHOOK_URL, GRAFANA_ADMIN_USER, GRAFANA_ADMIN_PASSWORD
# The infisical-machine-identity Secret must exist in the monitoring namespace
# (see setup/12-monitoring.md, Step 1).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: monitoring-secrets
  namespace: monitoring
spec:
  hostAPI: {{INFISICAL_API_URL}}
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: {{INFISICAL_PROJECT_SLUG}}
        envSlug: {{INFISICAL_ENV}}
        secretsPath: /monitoring
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: monitoring
  managedSecretReference:
    secretName: monitoring-secrets
    secretNamespace: monitoring
    secretType: Opaque
    creationPolicy: Owner
