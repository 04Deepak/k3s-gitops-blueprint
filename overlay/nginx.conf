# Nginx Configuration — SPA Frontend + Backend API Proxy
#
# This config serves a single-page application (React/Vue/Angular) and proxies
# /api/ requests to a backend Kubernetes service. It includes:
#
#   - Security headers (OWASP recommendations)
#   - Gzip compression
#   - Aggressive caching for hashed static assets (Vite/Webpack)
#   - SPA fallback (all non-file routes → index.html)
#   - WebSocket upgrade support (for SSE, WebSocket endpoints)
#   - CSP in Report-Only mode (tighten once you know your sources)
#
# In Kubernetes, the frontend pod runs nginx, and the backend is a separate
# Service reachable via K8s DNS (e.g. backend-service.my-namespace.svc.cluster.local).
# Traefik (the cluster ingress) handles TLS termination and routes to this pod.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # Max simultaneous connections per worker.
    # 1024 is fine for most apps — increase for high-concurrency SSE.
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Don't reveal the nginx version in response headers.
    server_tokens off;

    # Standard log format with forwarded-for (Traefik adds this).
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # ── Gzip Compression ──────────────────────────────────────────────
    # Compresses text-based responses. Images and already-compressed formats
    # (PNG, JPEG, WOFF2) are excluded by default — don't add them here.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;          # 6 is a good balance of CPU vs compression ratio
    gzip_min_length 1000;       # Don't bother compressing tiny responses
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ── Security Headers ──────────────────────────────────────────
        # These are added to EVERY response from this server block.

        # Prevent clickjacking — only allow framing from the same origin.
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Prevent MIME-type sniffing — browsers must respect Content-Type.
        add_header X-Content-Type-Options "nosniff" always;

        # Control how much referrer info is sent to other origins.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Force HTTPS for 1 year, including subdomains.
        # Only enable this AFTER TLS is confirmed working.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Disable browser features you don't use (geolocation, mic, camera).
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Content Security Policy — START IN REPORT-ONLY MODE.
        # This logs violations without blocking them. Once you've confirmed
        # no legitimate sources are blocked, switch to enforcing:
        #   Change "Content-Security-Policy-Report-Only" → "Content-Security-Policy"
        #
        # Adjust the sources to match your app:
        #   - script-src: add CDN domains if you use external JS
        #   - style-src: 'unsafe-inline' is needed for most CSS-in-JS / Tailwind
        #   - connect-src: add API domains, analytics endpoints, etc.
        #   - img-src: add S3 bucket domain if serving user uploads
        add_header Content-Security-Policy-Report-Only
            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self';"
            always;

        # ── API Reverse Proxy ─────────────────────────────────────────
        # Routes /api/ requests to the backend K8s Service.
        #
        # In-cluster, "backend-service" resolves via K8s DNS:
        #   backend-service.<namespace>.svc.cluster.local
        #
        # Replace "backend-service" and "5000" with your backend's
        # Service name and container port.
        location /api/ {
            proxy_pass http://backend-service:5000/api/;

            # HTTP/1.1 is required for WebSocket/SSE upgrade.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Forward the real client info (Traefik sets X-Forwarded-For).
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE: disable buffering so events stream to the client immediately.
            # Without this, nginx buffers SSE events and delivers them in chunks.
            proxy_buffering off;
            proxy_cache off;

            # Generous timeouts for:
            #   - SSE (long-lived connections)
            #   - File uploads (large POST bodies)
            #   - Slow queries
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── Static Assets (hashed filenames) ──────────────────────────
        # Vite produces filenames like /assets/index-a1b2c3d4.js.
        # These are content-hashed, so they can be cached forever —
        # a code change produces a new filename, busting the cache.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── SPA Fallback ──────────────────────────────────────────────
        # All non-file, non-API requests serve index.html.
        # This is what makes client-side routing work — /dashboard,
        # /settings, /users/123 all serve the same HTML, and React
        # Router (or equivalent) handles the path.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Block Dotfiles ────────────────────────────────────────────
        # Prevent access to .env, .git, .htaccess, etc.
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
