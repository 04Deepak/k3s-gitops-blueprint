# InfisicalSecret CRDs — auto-sync secrets from Infisical to K8s Secrets
# The secrets operator polls Infisical every 60s and creates/updates
# the target K8s Secret. Pods using envFrom pick up changes via auto-reload.
---
# Production: syncs all secrets from the root path
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{PROJECT_NAME}}-backend-secrets
  namespace: {{NAMESPACE}}
spec:
  hostAPI: {{INFISICAL_API_URL}}
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: {{INFISICAL_PROJECT_SLUG}}
        envSlug: {{INFISICAL_ENV}}
        secretsPath: /
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: {{NAMESPACE}}
  managedSecretReference:
    secretName: backend-secrets
    secretNamespace: {{NAMESPACE}}
    secretType: Opaque
    creationPolicy: Owner
---
# Staging: syncs all secrets from the root path (staging environment)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{PROJECT_NAME}}-staging-secrets
  namespace: {{STAGING_NAMESPACE}}
spec:
  hostAPI: {{INFISICAL_API_URL}}
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: {{INFISICAL_PROJECT_SLUG}}
        envSlug: {{INFISICAL_STAGING_ENV}}
        secretsPath: /
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: {{STAGING_NAMESPACE}}
  managedSecretReference:
    secretName: backend-secrets
    secretNamespace: {{STAGING_NAMESPACE}}
    secretType: Opaque
    creationPolicy: Owner
