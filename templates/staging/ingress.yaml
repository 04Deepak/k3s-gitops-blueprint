apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: {{STAGING_NAMESPACE}}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{PROJECT_NAME}}-staging-http-redirect
  namespace: {{STAGING_NAMESPACE}}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`{{STAGING_DOMAIN}}`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: frontend-service
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{PROJECT_NAME}}-staging-https
  namespace: {{STAGING_NAMESPACE}}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{STAGING_DOMAIN}}`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: backend-service
          port: {{BACKEND_PORT}}
    - match: Host(`{{STAGING_DOMAIN}}`)
      kind: Rule
      services:
        - name: frontend-service
          port: 80
  tls:
    certResolver: letsencrypt
    domains:
      - main: "{{STAGING_DOMAIN}}"
