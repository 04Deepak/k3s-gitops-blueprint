# Traefik Middleware: HTTP → HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: {{NAMESPACE}}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# HTTP entrypoint — redirects all traffic to HTTPS
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{PROJECT_NAME}}-http-redirect
  namespace: {{NAMESPACE}}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`{{DOMAIN}}`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: frontend-service
          port: 80
---
# HTTPS entrypoint — routes /api to backend, everything else to frontend
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{PROJECT_NAME}}-https
  namespace: {{NAMESPACE}}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{DOMAIN}}`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: backend-service
          port: {{BACKEND_PORT}}
    - match: Host(`{{DOMAIN}}`)
      kind: Rule
      services:
        - name: frontend-service
          port: 80
  tls:
    certResolver: letsencrypt
    domains:
      - main: "{{DOMAIN}}"
