apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{PROJECT_NAME}}-frontend
  namespace: {{STAGING_NAMESPACE}}
  labels:
    app: {{PROJECT_NAME}}-frontend
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{PROJECT_NAME}}-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{PROJECT_NAME}}-frontend
        environment: staging
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: {{FRONTEND_IMAGE}}:{{IMAGE_TAG}}
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: {{STAGING_NAMESPACE}}
  labels:
    app: {{PROJECT_NAME}}-frontend
    environment: staging
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: {{PROJECT_NAME}}-frontend
