apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: pgbouncer-credentials
  namespace: {{STAGING_NAMESPACE}}
spec:
  hostAPI: {{INFISICAL_API_URL}}
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: {{INFISICAL_PROJECT_SLUG}}
        envSlug: {{INFISICAL_STAGING_ENV}}
        secretsPath: /pgbouncer
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: {{STAGING_NAMESPACE}}
  managedSecretReference:
    secretName: pgbouncer-auth
    secretNamespace: {{STAGING_NAMESPACE}}
    secretType: Opaque
    creationPolicy: Owner
