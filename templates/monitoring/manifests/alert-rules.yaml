# Application and platform alerts. The kube-prometheus-stack already ships ~100 generic
# Kubernetes/node alerts; these add the ones specific to this blueprint.
# UPPER_CASE double-brace tokens are replaced by init.sh; the lowercase labels templating (with a dollar sign) is Prometheus syntax and is left alone.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{PROJECT_NAME}}-alerts
  namespace: monitoring
spec:
  groups:
    - name: {{PROJECT_NAME}}.workloads
      rules:
        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace=~"{{NAMESPACE}}|{{STAGING_NAMESPACE}}"}[15m]) > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} is restarting repeatedly"
            description: "Container {{ $labels.container }} restarted more than 3 times in 15 minutes. Check: kubectl logs {{ $labels.pod }} -n {{ $labels.namespace }} --previous"

        - alert: PodNotReady
          expr: sum by (namespace, pod) (kube_pod_status_ready{condition="false", namespace=~"{{NAMESPACE}}|{{STAGING_NAMESPACE}}"}) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} has not been Ready for 10 minutes"

        - alert: DeploymentReplicasUnavailable
          expr: kube_deployment_status_replicas_available{namespace=~"{{NAMESPACE}}|{{STAGING_NAMESPACE}}"} < kube_deployment_spec_replicas{namespace=~"{{NAMESPACE}}|{{STAGING_NAMESPACE}}"}
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.deployment }} is missing replicas"

        - alert: StatefulSetNotReady
          expr: kube_statefulset_status_replicas_ready < kube_statefulset_status_replicas
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} is not fully ready (database or cache down?)"

        - alert: ContainerOOMKilled
          expr: increase(kube_pod_container_status_restarts_total[10m]) > 0 and on (namespace, pod, container) kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled"
            description: "Raise the memory limit or find the leak."

        - alert: ContainerMemoryNearLimit
          expr: max by (namespace, pod, container) (container_memory_working_set_bytes{container!="", namespace=~"{{NAMESPACE}}|{{STAGING_NAMESPACE}}"}) / max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory", namespace=~"{{NAMESPACE}}|{{STAGING_NAMESPACE}}"}) > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is above 90% of its memory limit"

        - alert: HPAMaxedOut
          expr: kube_horizontalpodautoscaler_status_current_replicas{namespace=~"{{NAMESPACE}}|{{STAGING_NAMESPACE}}"} == kube_horizontalpodautoscaler_spec_max_replicas{namespace=~"{{NAMESPACE}}|{{STAGING_NAMESPACE}}"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} has been at max replicas for 15 minutes"

        - alert: CronJobFailed
          expr: kube_job_status_failed{namespace=~"{{NAMESPACE}}|{{STAGING_NAMESPACE}}"} > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed (backup or scheduled task?)"

    - name: {{PROJECT_NAME}}.node
      rules:
        - alert: NodeDiskFilling
          expr: node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} < 0.15
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Less than 15% disk space left on {{ $labels.instance }}"

        - alert: NodeMemoryPressure
          expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Memory above 90% on {{ $labels.instance }}"

        - alert: PersistentVolumeFilling
          expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.15
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has less than 15% space left"

    - name: {{PROJECT_NAME}}.ingress
      rules:
        # These two need the Traefik PodMonitor (manifests/traefik-podmonitor.yaml) to be scraping.
        - alert: IngressHigh5xxRate
          expr: sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) / sum(rate(traefik_service_requests_total[5m])) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "More than 5% of requests through Traefik are returning 5xx"

        - alert: TLSCertificateExpiringSoon
          expr: (traefik_tls_certs_not_after - time()) / 86400 < 14
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "TLS certificate {{ $labels.cn }} expires in under 14 days (Let's Encrypt renewal failing?)"
