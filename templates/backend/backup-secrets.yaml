# The ONE Secret in this blueprint that deliberately does not come from Infisical.
#
# Everything else should: that is the whole point of running a vault. This one cannot, because
# of what it is for. If the node dies, or the Infisical database is corrupted, or the machine
# identity is revoked, the backup job is how you get back — and a backup job whose credentials
# live in Infisical is unusable in exactly the situation it exists for. Restoring the vault
# would require the vault.
#
# So these four values are created out of band and kept somewhere a dead cluster cannot take
# with it: your password manager, or printed and in a drawer. Write them into your runbook as
# the first thing a restore needs.
#
# DO NOT commit this file with real values in it. Create the Secret from the command line so
# the values never touch git:
#
#   kubectl -n {{NAMESPACE}} create secret generic backup-secrets \
#     --from-literal=AWS_ACCESS_KEY_ID='...' \
#     --from-literal=AWS_SECRET_ACCESS_KEY='...' \
#     --from-literal=DATABASE_URL='postgresql://user:pass@postgres.shared:5432/{{DB_NAME}}' \
#     --from-literal=INFISICAL_DATABASE_URL='postgresql://user:pass@postgres.shared:5432/infisical'
#
# Read a value from a hidden prompt rather than typing it inline, so it stays out of your shell
# history too:
#
#   read -rsp 'secret access key: ' V && kubectl -n {{NAMESPACE}} create secret generic backup-secrets \
#     --from-literal=AWS_SECRET_ACCESS_KEY="$V" ... ; unset V
#
# The manifest below is here to document the shape, and to be applied only if you accept that
# whatever you put in stringData is in your shell history or your editor's undo buffer.
apiVersion: v1
kind: Secret
metadata:
  name: backup-secrets
  namespace: {{NAMESPACE}}
  annotations:
    # Not managed by the Infisical operator, and not by ArgoCD either — if ArgoCD owned it,
    # rebuilding the cluster from git would recreate an empty Secret over the real one.
    blueprint.local/managed-by: out-of-band
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  # Direct to PostgreSQL, not PgBouncer: a dump needs a consistent snapshot on one session.
  DATABASE_URL: "postgresql://REPLACE_ME@postgres.shared:5432/{{DB_NAME}}"
  # The vault's own database. Omit this key and the CronJob skips it with a SKIP line —
  # which means your credentials are not in your backups.
  INFISICAL_DATABASE_URL: "postgresql://REPLACE_ME@postgres.shared:5432/infisical"
